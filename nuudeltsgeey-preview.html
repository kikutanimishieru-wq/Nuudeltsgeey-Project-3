    const ranks=[

      {id:9,mn:'Их хаан',en:'Great Khan',color:'#d5a52c',motif:'crown'}

    const events=[['Nuudeltsgeey #001','Oct 20, 2026','5v5','32 teams','REGISTRATION OPEN','orange'],['Community Cup','Oct 28, 2026','5v5','16 teams','CHECK-IN','blue'],['Nomad Arena Series','Nov 5, 2026','5v5','32 teams','UPCOMING','steel'],['Café Clash','Nov 12, 2026','1v1','64 players','UPCOMING','purple']];

    const matches=[['Nomad','Steppe','13 — 11','VERIFIED','Oct 12, 2026 · 18:20'],['Khangai','Tumen','8 — 13','VERIFIED','Oct 12, 2026 · 17:05'],['Altan','Khorchin','13 — 9','PENDING','Oct 12, 2026 · 15:42'],['Ger','Suld','7 — 13','VERIFIED','Oct 12, 2026 · 14:10']];
    function motif(type){if(type==='dot')return '<circle cx="50" cy="60" r="8" fill="#f8e6b2"/>';if(type==='two')return '<circle cx="40" cy="60" r="4.5" fill="#f8e6b2"/><circle cx="60" cy="60" r="4.5" fill="#f8e6b2"/>';if(type==='nine')return [37,50,63].flatMap(y=>[37,50,63].map(x=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#f8e6b2"/>`)).join('');if(type==='bars')return [34,45,56,67].map(x=>`<rect x="${x}" y="40" width="6" height="43" fill="#f8e6b2"/>`).join('');if(type==='mountain')return '<path d="M26 78 50 28 74 78Z" fill="none" stroke="#fff2cc" stroke-width="4"/><path d="M36 63h28M42 51h16" stroke="#fff2cc" stroke-width="4"/>';if(type==='flame')return '<path d="M51 26C39 45 30 52 30 66c0 15 9 25 21 25 14 0 23-11 23-25 0-12-10-23-23-40Z" fill="#f9f5e8"/>';if(type==='sun')return Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<circle cx="${50+23*Math.cos(a)}" cy="${60+23*Math.sin(a)}" r="6" fill="#f8d06a"/>`}).join('')+'<circle cx="50" cy="60" r="9" fill="#f8d06a"/>';if(type==='star')return '<path d="M50 30 58 51 79 60 58 68 50 89 42 68 21 60 42 51Z" fill="#f8e6b2"/><circle cx="50" cy="60" r="7" fill="#1b2530"/>';return '<circle cx="50" cy="60" r="24" fill="none" stroke="#fff0ba" stroke-width="4"/><path d="M50 38C43 51 36 58 36 67a14 14 0 0 0 28 0c0-9-7-16-14-29Z" fill="#fff0ba"/>';}

    function heading(title,subtitle){return `<div class="page-heading"><div><p>${subtitle}</p><h1>${title}</h1></div><span class="page-date">SAMPLE PREVIEW · 2026</span></div>`;}
    function rankStrip(){return `<section class="panel rank-section"><div class="section-title"><div><div class="eyebrow">PATH OF THE KHAN</div><h2>From recruit to Great Khan</h2></div><button data-page="rankings">View all ranks →</button></div><div class="rank-scroll"><div class="rank-strip">${ranks.map(r=>`<article class="rank-card">${banner(r)}<h3>${r.mn}</h3><p>${r.en}</p><small>Tier ${r.id}</small></article>`).join('')}</div></div></section>`;}
    function tournamentCards(){return `<div class="tournament-grid">${events.slice(0,3).map((e,i)=>`<article class="event-card"><div class="event-art ${e[5]}" style="background-image:linear-gradient(120deg,#0b1722aa,#6c553588),url('backend/public/images/mongolian-cs2-hero.png');background-position:${30+i*30}% center"><span class="event-status">${e[4]}</span></div><div class="event-body"><h3>${e[0]}</h3><div class="event-location">◷ ${e[1]}</div><div class="event-meta"><span>♟ ${e[2]}</span><span>♙ ${e[3]}</span></div><div class="event-bottom"><strong>Open event</strong><button class="join">View details →</button></div></div></article>`).join('')}</div>`;}
    function overview(){return heading('Your arena. Your legacy.','Nuudeltsgeey competitive identity · Season 01')+`<section class="hero"><div class="hero-content"><span class="hero-label">SEASON 01 / THE RISE OF THE NOMAD</span><h2>MONGOLIAN CS2.<br><span>BUILT TO COMPETE.</span></h2><p>From your local café to the national stage.<br>Find your people. Earn your rank. Build your legacy.</p><div class="actions"><button class="primary" data-page="tournaments">Find a tournament ↗</button><button class="secondary" data-page="rankings">Explore rankings</button></div></div><span class="hero-caption">MONGOLIA · SERVER-VERIFIED FUTURE</span></section><div class="stats">${[['Players in the arena','2,486','↑ 128','this week','♧'],['Upcoming tournaments','03','OPEN','local events','⚑'],['Ranks in the hierarchy','09','TIER','Mongolian identity','✥'],['Records verified','124','LIVE','server history','◈']].map(s=>`<div class="stat"><div class="stat-top">${s[0]}<b>${s[4]}</b></div><strong>${s[1]}</strong><small><em>${s[2]}</em> ${s[3]}</small></div>`).join('')}</div><div class="columns"><div><div class="section-title"><h2>Upcoming tournaments</h2><button data-page="tournaments">View all →</button></div>${tournamentCards()}<div class="dashboard-lower"><section><div class="section-title"><h2>Top players</h2><button data-page="rankings">View all →</button></div><div class="panel">${players.slice(0,4).map((p,i)=>`<div class="rank-row"><span class="rank-num">0${i+1}</span><span class="clan">${p[0][0]}</span><div><b>${p[0]}</b><small>${p[1]}</small></div><span class="rank-score">${p[2]}</span></div>`).join('')}</div></section><section><div class="section-title"><h2>Watch live</h2><button data-page="watch">Explore →</button></div><button class="live-panel" data-page="watch"><span class="eyebrow">FEATURED REPLAY</span><h3>The MongolZ<br>vs. the world.</h3><p>Discover Mongolia’s competitive scene ↗</p></button></section></div></div><aside class="right-column"><div class="panel"><div class="panel-heading"><h3>My badge</h3><span>PREVIEW</span></div>${badge()}<button class="join wide" data-page="badge">View my badge ↗</button></div><div class="panel"><div class="streak"><b>ϟ</b><div><h4>Keep the fire alive.</h4><p>Your next match starts a new streak.</p></div></div><div class="days">${['M','T','W','T','F','S','S'].map((d,i)=>`<div class="day ${i===3?'today':''}"><span>${i===3?'·':'–'}</span>${d}</div>`).join('')}</div></div></aside></div>`;}
    function badge(){const r=ranks[0];return `<div class="badge-preview"><span class="eyebrow">NUUDELTSGEEY · COMPETITIVE IDENTITY</span>${banner(r)}<h3>BATU</h3><p>NMD-000127 · SHИНЭ ДАЙЧИН</p><div class="badge-id"><span>SAMPLE</span><span>RIFLER</span></div><div class="progress-label"><span>Road to Tier 2</span><b>320 / 1,000 NR</b></div><div class="progress"><span></span></div></div>`;}
    function rankings(){return heading('The Path of the Khan','Nine historically inspired Mongolian military ranks · sample data')+rankStrip()+`<div class="content-card"><div class="section-title"><h2>Season 01 leaderboard</h2><span class="eyebrow">SAMPLE DATA</span></div><table class="table"><thead><tr><th>#</th><th>PLAYER</th><th>RANK</th><th>NR</th><th>MATCHES</th></tr></thead><tbody>${players.map((p,i)=>`<tr><td>${i+1}</td><td><b>${p[0]}</b></td><td class="gold">${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td></tr>`).join('')}</tbody></table></div>`;}
    function tournaments(){return heading('Find your next challenge.','Local stages, real competition, one place to build your legacy.')+`<div class="notice">Visual preview only. Tournament cards below use sample data and are not connected to the database.</div><div style="height:16px"></div>${tournamentCards()}`;}
    function clans(){return heading('Find your banner.','Your café, school, neighborhood, and community.')+`<div class="tournament-grid">${[['⛨','Khangai','The mountain standard'],['♜','Altan','Golden steppe collective'],['✥','Nomad','Built for the road'],['⚔','Ikh Zasag','Law, honor, competition']].map(c=>`<section class="panel"><span class="clan">${c[0]}</span><h2>${c[1]}</h2><p style="color:var(--muted)">${c[2]}</p><p class="gold">Sample community profile</p><button class="join wide">View clan →</button></section>`).join('')}</div>`;}
    function watch(){return heading('The arena, from anywhere.','Follow the players putting Mongolia on the map.')+`<div class="notice">Live feeds are not connected in this visual preview.</div><div style="height:16px"></div><div class="dashboard-lower"><section class="panel"><span class="eyebrow">DISCOVER</span><h2>Mongolian Counter-Strike</h2><p style="color:var(--muted);line-height:1.8">Find tournament broadcasts, match highlights, and community casters.</p><button class="primary">Explore broadcasts ↗</button></section><section class="live-panel"><span class="eyebrow">FEATURED REPLAY</span><h3>The MongolZ<br>vs. the world.</h3><p>Sample media card · no external feed connected.</p></section></div>`;}
    function badgePage(){return heading('More than a player name.','Your competitive identity, built one match at a time.')+`<div class="profile-layout"><div>${badge()}</div><div><div class="content-card"><div class="section-title"><h2>Player dossier</h2><span class="eyebrow">SAMPLE DATA</span></div><table class="table"><tbody>${[['Player','BATU'],['Nuudeltsgeey ID','NMD-000127'],['Competitive role','Rifler'],['Verification','Sample preview'],['Home','Ulaanbaatar'],['Rank','Шинэ дайчин · Tier 1'],['Floor','01 · Protected']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div><div class="content-card"><h2>Tournament history</h2><p style="color:var(--muted)">Sample records will appear here after verified events.</p></div></div></div>`;}
    function wallet(){return heading('Fuel your next move.','Arena Token preview · sample balances only')+`<div class="notice">Demo wallet. Tokens have no monetary value and are not connected to the backend.</div><div style="height:16px"></div><div class="wallet-total"><span class="eyebrow">AVAILABLE BALANCE</span><strong>◈ 1,250 AT</strong><p style="color:var(--muted)">Sample starter allocation</p></div><div style="height:18px"></div><div class="content-card"><h2>Token activity</h2><table class="table"><tbody><tr><td>Welcome to the arena</td><td class="gold">+1,250 AT</td></tr><tr><td>Tournament entry · sample</td><td>—</td></tr></tbody></table></div>`;}
    function economy(){return heading('Earn your place. Build our future.','Nuudeltsgeey Movement · Token Economy preview')+`<section class="wallet-total"><span class="eyebrow">IKH ZASAG · THE CORE LAW</span><strong>HONOR CREATES VALUE.</strong><p>Participation. Discipline. Skill. Community.</p></section><div style="height:18px"></div><div class="content-card"><h2>Points, not crypto.</h2><p style="color:var(--muted);line-height:1.8">This visual preview describes the proposed economy. Minting, payments, café POS, transfers, and staking are not connected.</p></div>`;}
    function rules(){return heading('Competition rules','The law of the arena · visual reference only')+`<div class="content-card"><div class="rule-list"><div><strong>01 · Verified results</strong><br>Only server-verified match results can change rank or issue rewards.</div><div><strong>02 · Protected beginning</strong><br>Early floors protect new players while they learn the arena.</div><div><strong>03 · Team honor</strong><br>Roster, check-in, and result operations belong to the tournament system.</div><div><strong>04 · Build a legacy</strong><br>Every verified match contributes to public identity and progression.</div></div></div>`;}
    const pages={overview,rankings,tournaments,clans,watch,badge:badgePage,wallet,economy,rules};const labels={overview:'Overview',rankings:'Leaderboard',tournaments:'Tournaments',clans:'Clans',watch:'Watch live',badge:'My badge',wallet:'Wallet',economy:'Token economy',rules:'Competition rules'};function go(page){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.querySelector('#main').innerHTML=pages[page]();document.querySelector('#crumb').textContent=labels[page];document.querySelector('#sidebar').classList.remove('open');window.scrollTo(0,0);}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){e.preventDefault();go(b.dataset.page);}});document.querySelector('#menu').addEventListener('click',()=>document.querySelector('#sidebar').classList.toggle('open'));go('overview');
  </script>
</body>
</html>
